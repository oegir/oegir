<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Aleksei Petrov | PHP Backend Developer</title>
  <meta name="description" content="Aleksei Petrov - PHP Backend Developer with 10+ years of experience in backend and web application development.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="canonical" href="https://oegir.github.io/oegir/">
  <link rel="alternate" hreflang="en" type="text/markdown" href="https://oegir.github.io/oegir/docs/resume.md">
  <link rel="alternate" hreflang="ru" type="text/markdown" href="https://oegir.github.io/oegir/docs/ru/resume.md">
  <link rel="alternate" hreflang="bg" type="text/markdown" href="https://oegir.github.io/oegir/docs/bg/resume.md">
  <link rel="alternate" hreflang="x-default" type="text/html" href="https://oegir.github.io/oegir/">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <script>
    if (!location.hash || location.hash === '#' || location.hash === '#/') {
      var resumeByLanguage = {
        en: 'resume.md',
        ru: 'ru/resume.md',
        bg: 'bg/resume.md'
      }
      var browserLanguages = []

      try {
        if (Array.isArray(navigator.languages)) {
          browserLanguages = navigator.languages.slice()
        }
        if (navigator.language && !browserLanguages.includes(navigator.language)) {
          browserLanguages.push(navigator.language)
        }
      } catch (error) {
        browserLanguages = []
      }

      var resumePage = 'resume.md'
      for (var language of browserLanguages) {
        if (typeof language !== 'string') {
          continue
        }

        var languageCode = language.toLowerCase().split('-')[0]
        if (resumeByLanguage[languageCode]) {
          resumePage = resumeByLanguage[languageCode]
          break
        }
      }

      location.hash = '#/' + resumePage
    }

    window.resumeSidebarFile = function () {
      var resumePath = location.hash.replace(/^#\/?/, '').split('?')[0]
      var sidebarByResume = {
        'resume.md': '_sidebar.md',
            'ru/resume.md': 'ru/_sidebar.md',
            'bg/resume.md': 'bg/_sidebar.md'
      }

      return sidebarByResume[resumePath] || '_sidebar.md'
    }

    window.currentResumeSidebar = window.resumeSidebarFile()
    window.addEventListener('hashchange', function () {
      var nextSidebar = window.resumeSidebarFile()
      if (nextSidebar !== window.currentResumeSidebar) {
        location.reload()
        return
      }

      window.currentResumeSidebar = nextSidebar
    })
  </script>
  <script>
    window.$docsify = {
      name: 'Aleksei Petrov',
      basePath: 'docs/',
      homepage: 'resume.md',
      loadSidebar: window.currentResumeSidebar,
      subMaxLevel: 0,
      sidebarDisplayLevel: 0,
      auto2top: true,
      repo: ''
    }
  </script>
  <!-- Docsify resource -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
</body>
</html>
