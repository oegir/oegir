<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Aleksei Petrov | PHP Backend Developer</title>
  <meta name="description" content="Aleksei Petrov - PHP Backend Developer with 10+ years of experience in backend and web application development.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <script>
    if (!location.hash || location.hash === '#' || location.hash === '#/') {
      var resumeByLanguage = {
        en: 'resume.md',
        ru: 'resume.ru.md',
        bg: 'resume.bg.md'
      }
      var browserLanguages = []

      try {
        if (Array.isArray(navigator.languages)) {
          browserLanguages = navigator.languages.slice()
        }
        if (navigator.language && !browserLanguages.includes(navigator.language)) {
          browserLanguages.push(navigator.language)
        }
      } catch (error) {
        browserLanguages = []
      }

      var resumePage = 'resume.md'
      for (var language of browserLanguages) {
        if (typeof language !== 'string') {
          continue
        }

        var languageCode = language.toLowerCase().split('-')[0]
        if (resumeByLanguage[languageCode]) {
          resumePage = resumeByLanguage[languageCode]
          break
        }
      }

      location.hash = '#/' + resumePage
    }
  </script>
  <script>
    window.$docsify = {
      name: 'Aleksei Petrov',
      basePath: 'docs/',
      homepage: 'resume.md',
      loadSidebar: false,
      subMaxLevel: 0,
      auto2top: true,
      repo: ''
    }
  </script>
  <!-- Docsify resource -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>
</body>
</html>
